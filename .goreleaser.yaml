version: 2

project_name: graudit

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  # Library project — no binaries (example/ is a demo program, not a
  # shipped CLI tool).
  - skip: true

archives:
  - id: source
    # Not tied to any build — the only build above is skipped (pure
    # library, no binary), so without meta:true this archive silently
    # produces nothing (confirmed pattern from grcache's own .goreleaser.yaml).
    meta: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_src"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - go.mod
      - go.sum
      # Both patterns are needed: "**/*.go" only matches files at least one
      # directory deep, so root-level files like audit.go/hash.go/errors.go
      # need "*.go" too.
      - "*.go"
      - "**/*.go"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  github:
    owner: gourdian25
    name: graudit
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"
  header: |
    ## {{ .ProjectName }} {{ .Version }}

    Append-only, tamper-evident audit trail for the gourdian ecosystem.

    ### Highlights
    - Hash-chained entries: Verify(from, to) detects tampering or deletion anywhere in a range
    - Three backends behind one AuditLog interface: in-memory (test/dev), PostgreSQL, MongoDB
    - RecordChange diffs a before/after snapshot automatically
    - Publishes one grevents event per successful write — the ecosystem's first real functional cross-repo dependency
    - A shared conformance test suite guaranteeing behavioral parity across backends, including a concurrent-write stress test and a deliberate-tamper test

    See [CHANGELOG.md](https://github.com/gourdian25/graudit/blob/master/CHANGELOG.md) for full details.

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^build:'
      - '^refactor:'
      - '^style:'
      - README
      - Merge pull request
